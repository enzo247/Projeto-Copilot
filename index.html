<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogo da Memória</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game" aria-label="Jogo da memória de tecnologia">
      <header class="header">
        <h1>Jogo da Memória</h1>

        <div class="stats" aria-label="Estatísticas do jogo">
          <div class="stat" aria-live="polite">
            <span class="stat-label">Jogadas</span>
            <span id="moves" class="stat-value">0</span>
          </div>

          <div class="stat" aria-live="polite">
            <span class="stat-label">Tempo</span>
            <span id="timer" class="stat-value">00:00</span>
          </div>
        </div>
      </header>

      <div id="board" class="board" aria-live="polite"></div>

      <div id="message" class="message" role="status" aria-live="polite">
        <h2>Parabéns!</h2>
        <p id="message-text">Você venceu.</p>
        <button id="restartButton" class="restart-btn" type="button">Jogar novamente</button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
